<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minibasket - Marcador en Vivo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      margin: 0;
      padding: 10px;
    }

    h1 { margin: 10px 0; color: #333; }

    .config, .tempo {
      background: white;
      padding: 15px;
      margin: 10px auto;
      width: 95%;
      max-width: 480px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .marcador {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }

    .equipo {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 45%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .puntos {
      font-size: 70px;
      font-weight: bold;
      margin: 10px 0;
    }

    .cronometro {
      font-size: 48px;
      font-family: monospace;
      margin: 10px 0;
      color: #444;
    }

    .controles button {
      font-size: 18px;
      margin: 4px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .btn-reset {
      background-color: #ffeded;
      color: #d9534f;
      border: 1px solid #d9534f;
      margin-top: 10px;
    }

    input[type="text"], input[type="number"] {
      font-size: 16px;
      padding: 5px;
      text-align: center;
    }

    /* ---- MODO SÓ MARCADOR ---- */
    .so-marcador .config, .so-marcador .controles, .so-marcador h1 {
      display: none;
    }
    .so-marcador .puntos { font-size: 120px; }
    .so-marcador .equipo { width: 48%; }
    .so-marcador .cronometro { font-size: 80px; }
  </style>
</head>
<body>

<h1>Minibasket Rosalía</h1>

<div class="config">
  <h3>Configuración do partido</h3>
  <strong>Local:</strong> ROSALÍA (Amarelo) <br><br>
  Visitante: <input type="text" id="nomeB" value="Equipo B">
  Cor: <input type="color" id="corB" value="#dc3545"><br><br>
  Tempos: <input type="number" id="totalTempos" value="6" min="1">
  Minutos: <input type="number" id="minutosTempo" value="8" min="1"><br><br>
  <button onclick="iniciarPartido()" style="background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px;">Iniciar partido</button>
</div>

<div class="tempo">
  <div>
    Tempo: <span id="tempoActual">-</span> / <span id="temposMax">-</span>
  </div>
  <div class="cronometro" id="cronometro">00:00</div>
  <button onclick="iniciarCrono()">▶️</button>
  <button onclick="pausarCrono()">⏸️</button>
  <button onclick="seguinteTempo()">⏭️ Seguinte tempo</button>
</div>

<div class="marcador">
  <div class="equipo">
    <h2 id="labelA">ROSALÍA</h2>
    <div class="puntos" id="puntosA" style="color: #FFD700;">0</div>
    <div class="controles">
      <button onclick="sumar('A',1)">+1</button>
      <button onclick="sumar('A',2)">+2</button>
      <button onclick="sumar('A',3)">+3</button>
      <button onclick="restar('A')">-1</button>
    </div>
  </div>

  <div class="equipo">
    <h2 id="labelB">Equipo B</h2>
    <div class="puntos" id="puntosB">0</div>
    <div class="controles">
      <button onclick="sumar('B',1)">+1</button>
      <button onclick="sumar('B',2)">+2</button>
      <button onclick="sumar('B',3)">+3</button>
      <button onclick="restar('B')">-1</button>
    </div>
  </div>
</div>

<div style="margin-bottom: 50px;">
    <button onclick="toggleSoMarcador()">👁 Só marcador (Modo TV)</button>
    <button onclick="limparMarcador()" class="btn-reset">🗑️ Reset Total</button>
</div>

<script>
  // Variables globales (usamos window para que Firebase las vea)
  window.puntosA = 0;
  window.puntosB = 0;
  window.tempoActual = 0;
  window.totalTempos = 0;
  window.duracionTempo = 0;
  window.segundosRestantes = 0;
  
  let intervalo = null;
  let soMarcador = false;

  function iniciarPartido() {
    window.totalTempos = parseInt(document.getElementById('totalTempos').value);
    window.duracionTempo = parseInt(document.getElementById('minutosTempo').value) * 60;
    window.tempoActual = 1;

    document.getElementById('labelA').innerText = 'ROSALÍA';
    document.getElementById('labelB').innerText = document.getElementById('nomeB').value;
    document.getElementById('labelB').style.color = document.getElementById('corB').value;
    document.getElementById('puntosB').style.color = document.getElementById('corB').value;
    
    document.getElementById('tempoActual').innerText = window.tempoActual;
    document.getElementById('temposMax').innerText = window.totalTempos;

    reiniciarCrono();
    if(window.enviarAFirebase) window.enviarAFirebase();
  }

  function reiniciarCrono() {
    pausarCrono();
    window.segundosRestantes = window.duracionTempo;
    actualizarCrono();
  }

  function iniciarCrono() {
    if (intervalo) return;
    intervalo = setInterval(() => {
      if (window.segundosRestantes > 0) {
        window.segundosRestantes--;
        actualizarCrono();
        // Opcional: enviarAFirebase(); cada segundo consume mucha cuota, 
        // mejor sincronizar solo al pausar o anotar.
      } else {
        pausarCrono();
        alert("¡Fin do tempo!");
      }
    }, 1000);
  }

  function pausarCrono() {
    clearInterval(intervalo);
    intervalo = null;
    if(window.enviarAFirebase) window.enviarAFirebase();
  }

  function actualizarCrono() {
    let min = Math.floor(window.segundosRestantes / 60);
    let seg = window.segundosRestantes % 60;
    document.getElementById('cronometro').innerText = 
      String(min).padStart(2, '0') + ":" + String(seg).padStart(2, '0');
  }

  function siguienteTempo() {
    if (window.tempoActual < window.totalTempos) {
      window.tempoActual++;
      document.getElementById('tempoActual').innerText = window.tempoActual;
      reiniciarCrono();
      if(window.enviarAFirebase) window.enviarAFirebase();
    } else {
      alert("¡Partido rematado!");
    }
  }

  function sumar(equipo, pts) {
    if (equipo === 'A') window.puntosA += pts;
    else window.puntosB += pts;
    actualizarPantalla();
    if(window.enviarAFirebase) window.enviarAFirebase();
  }

  function restar(equipo) {
    if (equipo === 'A' && window.puntosA > 0) window.puntosA--;
    else if (equipo === 'B' && window.puntosB > 0) window.puntosB--;
    actualizarPantalla();
    if(window.enviarAFirebase) window.enviarAFirebase();
  }

  function actualizarPantalla() {
    document.getElementById('puntosA').innerText = window.puntosA;
    document.getElementById('puntosB').innerText = window.puntosB;
  }

  function limparMarcador() {
    if(confirm("Seguro que queres reiniciar todo o marcador?")) {
        window.puntosA = 0;
        window.puntosB = 0;
        window.tempoActual = 0;
        actualizarPantalla();
        document.getElementById('cronometro').innerText = "00:00";
        document.getElementById('tempoActual').innerText = "-";
        if(window.enviarAFirebase) window.enviarAFirebase();
    }
  }

  function toggleSoMarcador() {
    soMarcador = !soMarcador;
    document.body.classList.toggle('so-marcador', soMarcador);
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB61bwum1jdJUsKK7XTVtBhDl31tZlVl14",
    authDomain: "marcador-rosalia-c0043.firebaseapp.com",
    databaseURL: "https://marcador-rosalia-c0043-default-rtdb.firebaseio.com",
    projectId: "marcador-rosalia-c0043",
    storageBucket: "marcador-rosalia-c0043.firebasestorage.app",
    messagingSenderId: "969819878631",
    appId: "1:969819878631:web:08c69e28ae0b3f31afde42"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const estadoRef = ref(db, 'partido/actual');

  // Función global para enviar datos
  window.enviarAFirebase = () => {
    set(estadoRef, {
      puntosA: window.puntosA,
      puntosB: window.puntosB,
      nomeB: document.getElementById('nomeB').value,
      corB: document.getElementById('corB').value,
      tempoActual: window.tempoActual,
      temposMax: window.totalTempos,
      crono: document.getElementById('cronometro').innerText,
      timestamp: Date.now()
    });
  };

  // Escuchar cambios (para tu mujer)
  onValue(estadoRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      // Actualizamos variables internas
      window.puntosA = data.puntosA;
      window.puntosB = data.puntosB;
      window.tempoActual = data.tempoActual;
      window.totalTempos = data.temposMax;

      // Actualizamos UI
      document.getElementById('puntosA').innerText = data.puntosA;
      document.getElementById('puntosB').innerText = data.puntosB;
      document.getElementById('labelB').innerText = data.nomeB;
      document.getElementById('labelB').style.color = data.corB;
      document.getElementById('puntosB').style.color = data.corB;
      document.getElementById('tempoActual').innerText = data.tempoActual || "-";
      document.getElementById('temposMax').innerText = data.temposMax || "-";
      document.getElementById('cronometro').innerText = data.crono;
    }
  });
</script>

</body>
</html>
